name: Deploy to Railway
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8
 
      - name: Lint with flake8
        run: |
          flake8 bot/ services/ --max-line-length=120 --ignore=E501,W503 --exclude=__pycache__
 
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          DISCORD_TOKEN: fake_token_for_testing
          FOOTBALL_DATA_API_KEY: fake_key_for_testing
 
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Railway CLI
        run: npm install -g @railway/cli
 
      - name: Deploy
        run: railway up --service goalwire
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
 
